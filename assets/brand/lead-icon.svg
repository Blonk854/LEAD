<svg xmlns="http://www.w3.org/2000/svg"
     width="192"
     height="192"
     viewBox="0 0 192 192">

  <!-- Squircle -->
  <rect x="16" y="16"
        width="160" height="160"
        rx="40"
        fill="#1F4E79"/>

  <!-- Pencil -->
  <g transform="translate(97 95) rotate(-135)">

    <!-- Body -->
    <rect x="-10" y="0"
          width="10" height="95"
          rx="3"
          fill="#F2C94C"/>

    <!-- Shadow face -->
    <rect x="0" y="0"
          width="10" height="95"
          rx="3"
          fill="#D9AA32"
          opacity="0.5"/>

    <!-- Wood -->
    <polygon points="-10,0 10,0 0,-20"
             fill="#D8B38A"/>

    <!-- Graphite -->
    <polygon points="-4,-12 4,-12 0,-22"
             fill="#333"/>

  </g>
</svg>
